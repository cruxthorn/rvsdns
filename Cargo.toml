[package]
name = "rvsdns"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.34"
hickory-net = "0.26.3"
hickory-proto = "0.26.3"
hickory-resolver = "0.26.3"
ipnet = "2.12.2"
tokio = { version = "1.54.1", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
