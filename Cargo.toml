[package]
name = "rvsdns"
version = "2.0.0"
edition = "2024"

description = "Reverse DNS Lookup Built with Rust."
license = "MIT"
repository = "https://github.com/cruxthorn/rvsdns"
readme = "README.md"

[dependencies]
futures = "0.3.34"
hickory-proto = "0.26.3"
tokio = { version = "1.54.1", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
